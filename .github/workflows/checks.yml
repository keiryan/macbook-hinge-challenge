name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  offline-checks:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Test challenge and freshness logic without a sensor
        run: node --test tests/*.test.js
      - name: Check server, browser scripts, and launcher syntax
        run: |
          python3 -m py_compile scripts/serve.py
          node --check web/app.js
          node --check web/hinge-challenge.js
          bash -n scripts/run.sh
      - name: Compile native reader without opening a device
        run: |
          mkdir -p .build/module-cache
          xcrun swiftc -O -module-cache-path .build/module-cache native/lid-reader.swift -o .build/lid-reader
